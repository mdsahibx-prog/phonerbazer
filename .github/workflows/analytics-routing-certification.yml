name: Analytics Control Center routing certification

on:
  push:
    branches:
      - fix/analytics-control-center-routing
  pull_request:

jobs:
  analytics-routing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/analytics-contract-test.ts
      - run: pnpm exec tsc --noEmit
