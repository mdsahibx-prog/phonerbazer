name: Sync original binary assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-binaries:
    if: github.repository == 'mdsahibx-prog/phonerbazer' && github.event.head_commit.message != 'chore: sync original binary assets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify original assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/SahiTech/SahiGatget/main"
          declare -A expected=(
            ["app/favicon.ico"]="2b8ad2d33455a8f736fc3a8ebf8f0bdea8848ad4c0db48a2833bd0f9cd775932"
            ["public/android-chrome-192x192.png"]="cc0b70dfc7ca3d612cf14e3069cbd721ce5275e8b7ee74ee2baf8da0c339b29f"
            ["public/android-chrome-512x512.png"]="fe776c4f1762ff89fc9cf6be9beb02c90a1124d8296beeb112680dbad9dbe573"
            ["public/apple-touch-icon.png"]="3ef2d72a4a72a2a1c82fef0ffffbfced571159b74b5b88f2a4488a40235158bc"
            ["public/favicon-16x16.png"]="f59f281cb5b7e3872f5a757b42f8a70d86b9be6472fc6561fea475b1fad6f43b"
            ["public/favicon-32x32.png"]="ab8487e0cf526950984ef1016ab2768bcccb305f4dd9d18772565728843ffec6"
            ["public/favicon.ico"]="fe6e25eea79656df1debf76a1ab693af4b7744b827eb483d8d853ecd8fd42495"
            ["public/fonts/NotoSans-Bold.ttf"]="e83493c945848ecd4a9ad0f6d19164541a0d3e23a9c952304a00a46e00272ac5"
            ["public/fonts/NotoSans-Regular.ttf"]="89c3c497f618fdaa0b2d1e98fef93582f28c71debd2c4a8cdf41f190ced2909d"
            ["public/fonts/NotoSansBengali-Bold.ttf"]="22c9ff99baca4d31c531ce450a1369beed889467e1ad964f4b8a6f810aa46955"
            ["public/fonts/NotoSansBengali-Regular.ttf"]="9bb35b3547829ecc42041b6017e87fd4c5f1da1edcd00f59171777050f346018"
            ["public/logo.png"]="51658685b43e85300375364f8c1f28f2872fd1d70ea05812a6ddc77720c4c899"
          )
          for path in "${!expected[@]}"; do
            mkdir -p "$(dirname "$path")"
            curl -fsSL "$base/$path" -o "$path"
            actual="$(sha256sum "$path" | cut -d' ' -f1)"
            test "$actual" = "${expected[$path]}" || { echo "HASH MISMATCH: $path"; exit 1; }
          done

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/favicon.ico public/android-chrome-192x192.png public/android-chrome-512x512.png public/apple-touch-icon.png public/favicon-16x16.png public/favicon-32x32.png public/favicon.ico public/fonts/NotoSans-Bold.ttf public/fonts/NotoSans-Regular.ttf public/fonts/NotoSansBengali-Bold.ttf public/fonts/NotoSansBengali-Regular.ttf public/logo.png
          git commit -m "chore: sync original binary assets"
          git push
