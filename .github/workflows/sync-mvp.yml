name: Sync MVP source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'mdsahibx-prog/phonerbazer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace target tree with existing MVP source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/phonerbazer-upstream
          git clone --depth 1 https://github.com/SahiTech/SahiGatget.git /tmp/phonerbazer-upstream
          rsync -a --delete --exclude='.git/' /tmp/phonerbazer-upstream/ ./
          rm -rf .git
          git init
          git checkout -b main
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize Phonerbazar MVP"
          git push --force origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
